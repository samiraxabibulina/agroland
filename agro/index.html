<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AgroLand</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
:root{--bg:#f4f3ee;--ink:#1f2a24;--muted:#7a8077;--green:#1e5b4a;--dark:#46594b;--gold:#d9a441;--sage:#e1e9d6;--peach:#f7e5cd;--line:#e2e0d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#e4e2d8;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
header .t{flex:1;line-height:1.15}
header b{display:block;font-size:18px;color:var(--green)}
header small{color:var(--muted);font-size:12px}
select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-weight:600;color:var(--ink);font-size:14px}
main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 20px;display:none}
.tab.on{display:block}
#tab-map{padding:0;overflow:hidden}
#map{position:absolute;inset:0}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--green);font-weight:700}
.farm{color:var(--muted);font-size:14px;margin:6px 0 10px}
h1{font-size:26px;line-height:1.2;margin:0}
.sub{color:var(--muted);margin:4px 0 16px}
.hero{background:var(--dark);color:#fff;border-radius:24px;padding:20px;margin-bottom:22px}
.hr{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;opacity:.9}
.big{font-size:46px;font-weight:700;margin:10px 0 2px}
.big small{font-size:18px;font-weight:500}
.hero p{margin:0 0 14px;font-size:14px;opacity:.85}
.attn{display:block;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;font-size:14px;cursor:pointer}
h2{font-size:20px;margin:0 0 4px}
.upd{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.tile{position:relative;border-radius:20px;padding:16px;min-height:130px;cursor:pointer}
.tile .ar{position:absolute;right:14px;top:14px;color:#6b705f;font-size:20px}
.tile .act{margin-top:8px;font-weight:600;color:#3d4339}
.tile.g{background:var(--sage)} .tile.b{background:#f1e7da} .tile.p{background:var(--peach)}
.tile .ic{font-size:22px}
.tile b{display:block;font-size:17px;margin:10px 0 2px}
.tile small{display:block;color:#5d6358;font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;cursor:pointer}
.row .sw{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.sp{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:#4a4033}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec h2{margin:0}
.all{font-size:14px;color:var(--green);font-weight:600;cursor:pointer}
.row .n{flex:1} .row b{display:block} .row small{color:var(--muted)}
.pill{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-right:6px}
.pill.prelim{background:transparent;color:#8a5a00;border:1px solid #8a5a00}
.demo{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.legend{position:absolute;z-index:1000;top:10px;left:10px;list-style:none;margin:0;padding:8px 12px;display:flex;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:13px}.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.field-label{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
#card{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:70%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:16px;display:none}
#card.open{display:block}
#card h2{margin:0 0 8px;font-size:18px}
#card h3{margin:14px 0 4px;font-size:14px;color:var(--muted)}
.ch{display:flex;justify-content:space-between;align-items:flex-start}
.close{background:none;border:0;font-size:28px;line-height:1;color:var(--muted)}
.dl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px;margin-top:14px}
.dl small{display:block;font-size:12px;color:var(--muted)}
.dl b{display:block;margin-top:2px}
.advice{margin:14px 0 0;line-height:1.45}
.note{margin:8px 0 0;font-size:12px;color:#8a5a00}
svg.chart{width:100%;height:auto;display:block}
.done{margin-top:14px;width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:600;padding:12px}
.done:disabled{background:#9db5a9}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.jr{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px}
.jr small{color:var(--muted)}
.about{line-height:1.5}

</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

    fields:'Dalalar', ok:'Me’yorda', dry:'Qurg‘oqchilik', saline:'Sho‘rlanish', pests:'Zararkunandalar', crop:'Ekin', irr:'Sug‘orish me’yori', date:'Ma’lumot sanasi',
    history:'Tarix (NDVI)', advice:'Tavsiya', prelim:'Dastlabki',
    prelimNote:'Hisob sun’iy yo‘ldosh modellari asosida, yerdagi kalibrlashdan oldin',
    done:'Bajarildi deb belgilash', saved:'Jurnalga yozildi', recDone:'Tavsiya bajarildi', journal:'Harakatlar jurnali',
    empty:'Hozircha yozuv yo‘q', close:'Yopish', mm:'mm', ha:'ga', loading:'Yuklanmoqda…', error:'Ma’lumotni yuklab bo‘lmadi',
    about:'AgroLand dalalar holatini Sentinel-2 sun’iy yo‘ldosh suratlari bo‘yicha ko‘rsatadi: NDVI, SI 1, SWIR SI indekslari va FAO-56 bo‘yicha sug‘orish me’yori.',
    crops:{ wheat:'Bug‘doy', corn:'Makkajo‘xori', sunflower:'Kungaboqar' },
    adviceBy:{ ok:'Sug‘orish jadval bo‘yicha, jiddiy og‘ish yo‘q.', dry:'Namlik past: yaqin kunlarda sug‘orishni rejalashtiring.', saline:'Sho‘rlanish belgilari: yuvish va joyida tekshirish kerak.', pests:'Zararkunanda o‘chog‘i bo‘lishi mumkin: dalani ko‘zdan kechiring.' } },
  en: { sub:'mini app', farm:'Farm', hello:'Your fields under control', hello2:'Everything for a healthy harvest',
    overview:'FARM OVERVIEW', nfields:'Fields: {n}', attn:'Need attention: {n}', monitoring:'Monitoring', upd:'Updated at {d}',
    tFieldsSub:'Open map', pestsSub:'Outbreaks found: {n}', pestsAct:'Needs inspection', drySub:'Fields: {n} · low moisture', dryAct:'Check irrigation',
    salSub:'Fields: {n}', salAct:'Check', fine:'Within normal', lowRisk:'Low risk',
    irrTitle:'Irrigation', irrSub2:'FAO-56 norm', pUrgent:'Urgent', pSoon:'Soon', pSched:'On schedule', myfields:'My fields', all:'All {n} →', demo:'Demo data · example farm status',
    home:'Home', map:'Map', tasks:'Tasks', more:'More',
    fields:'Fields', ok:'Normal', dry:'Dryness', saline:'Salinity', pests:'Pests', crop:'Crop', irr:'Irrigation norm', date:'Data as of',history:'History (NDVI)', advice:'Advice', prelim:'Preliminary',
    prelimNote:'Estimated from satellite models, before ground calibration',
    done:'Mark as done', saved:'Saved to log', recDone:'Recommendation done', journal:'Action log',
    empty:'No entries yet', close:'Close', mm:'mm', ha:'ha', loading:'Loading…', error:'Could not load data',
    about:'AgroLand shows field conditions from Sentinel-2 satellite imagery: NDVI, SI 1, SWIR SI indices and the FAO-56 irrigation norm.',
    crops:{ wheat:'Wheat', corn:'Corn', sunflower:'Sunflower' },
    adviceBy:{ ok:'Irrigate on schedule, no critical deviations.', dry:'Low moisture: plan irrigation in the coming days.', saline:'Signs of salinity: flushing and an on-site check are needed.', pests:'Possible pest outbreak: inspect the field.' } }
};
var COLORS = { ok:'#2f9e44', dry:'#e8a800', saline:'#d6336c', pests:'#c2662d' };
var ICONS = { home:'🏠', map:'🗺', tasks:'✅', more:'⋯' };
var TABS = ['home', 'map', 'tasks', 'more'];

function T(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k] !== undefined ? o[k] : ''; }); }
function tr() { return STR[lang]; }
function $(id) { return document.getElementById(id); }
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
  return null;
}

/* ================== ДАННЫЕ ================== */
async function getFields() {
  if (!API_URL) return MOCK_FIELDS;
  var r = await fetch(API_URL + '/fields');
  if (!r.ok) throw new Error('fields');
  return r.json();
}
async function getHistory(id) {
  if (!API_URL) return MOCK_HISTORY[id] || [];
  var r = await fetch(API_URL + '/fields/' + id + '/history');
  if (!r.ok) return [];
  return r.json();
}

/* ================== СОСТОЯНИЕ ================== */
var params = new URLSearchParams(location.search);
var tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
var tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
var lang = [params.get('lang'), store('lang'), tgUser && tgUser.language_code].filter(function (l) { return STR[l]; })[0] || 'ru';
var tab = 'home', selectedId = null, fields = null, layer = null;
var journal = [];
try { journal = JSON.parse(store('journal') || '[]'); } catch (e) { journal = []; }

if (tg) {
  tg.ready();
  tg.expand();
  tg.BackButton.onClick(function () { setTab('home'); });
}

var map = L.map('map', { zoomControl: false }).setView([40.3, 68.3], 8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles © Esri', maxZoom: 18 }).addTo(map);

function props() { return fields.features.map(function (f) { return f.properties; }); }
function findField(id) { return props().filter(function (p) { return p.id === id; })[0]; }
function cropName(c) { return tr().crops[c] || c; }

/* ================== ГЛАВНАЯ ================== */
var showAll = false;
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fname(p) { return p['name_' + lang] || p.name; }
function toggleAll() { showAll = !showAll; renderHome(); }
function renderHome() {
  var t = tr(), ps = props(), total = 0, cnt = { dry: 0, saline: 0, pests: 0 }, crops = [];
  ps.forEach(function (p) {
    total += p.area_ha || 0;
    if (cnt[p.status] !== undefined) cnt[p.status]++;
    if (crops.indexOf(p.crop) < 0) crops.push(p.crop);
  });
  var attn = cnt.dry + cnt.saline + cnt.pests, h = '';
  function tile(cls, ic, title, s1, s2) {
    return '<div class="tile ' + cls + '" onclick="setTab(\'map\')"><span class="ar">›</span><div class="ic">' + ic + '</div><b>' + title + '</b><small>' + s1 + '</small><small class="act">' + s2 + '</small></div>';
  }
  h += '<div class="farm">🏠 ' + t.farm + ' «' + FARM + '»</div>';h += '<h1>' + t.hello + '</h1><p class="sub">' + t.hello2 + '</p>';
  h += '<div class="hero"><div class="hr"><span>' + t.overview + '</span><span>☀ +' + WEATHER.temp + '°</span></div>';
  h += '<div class="big">' + fmt(total) + ' <small>' + t.ha + '</small></div>';
  h += '<p>' + T(t.nfields, { n: ps.length }) + ' · ' + crops.map(function (c) { return cropName(c); }).join(', ').toLowerCase() + '</p>';
  h += '<a class="attn" onclick="setTab(\'map\')">⚠ ' + T(t.attn, { n: attn }) + ' →</a></div>';
  h += '<div class="sec"><h2>' + t.monitoring + '</h2><span class="upd">' + T(t.upd, { d: UPDATED_AT }) + '</span></div>';
  h += '<div class="grid2">';
  h += tile('g', '🌾', t.fields, T(t.nfields, { n: ps.length }) + ' · ' + fmt(total) + ' ' + t.ha, t.tFieldsSub);
  h += tile('b', '🐛', t.pests, cnt.pests ? T(t.pestsSub, { n: cnt.pests }) : t.fine, cnt.pests ? t.pestsAct : t.lowRisk);
  h += tile('g', '🧂', t.saline, cnt.saline ? T(t.salSub, { n: cnt.saline }) : t.fine, cnt.saline ? t.salAct : t.lowRisk);
  h += tile('p', '💧', t.dry, cnt.dry ? T(t.drySub, { n: cnt.dry }) : t.fine, cnt.dry ? t.dryAct : t.lowRisk);
  h += '</div>';
  var score = { dry: 3, saline: 2 };
var irr = ps.slice().sort(function (a, b) {
    var sa = score[a.status] ? score[a.status] : 1;
    var sb = score[b.status] ? score[b.status] : 1;
    if (sa !== sb) return sb - sa;
    return b.irrigation_mm - a.irrigation_mm;
  }).slice(0, 3);
  h += '<div class="sec"><h2>' + t.irrTitle + '</h2><span class="upd">' + t.irrSub2 + '</span></div>';
  irr.forEach(function (p) {
    var pr = p.status === 'dry' ? ['pUrgent', COLORS.dry] : p.status === 'saline' ? ['pSoon', COLORS.saline] : ['pSched', COLORS.ok];
    h += '<div class="row" onclick="openField(\'' + p.id + '\')"><div class="sw" style="background:#cfe3f1">💧</div>';
    h += '<div class="n"><b>' + fname(p) + '</b><small>' + p.irrigation_mm + ' ' + t.mm + ' · ' + cropName(p.crop) + '</small></div>';
    h += '<span class="sp" style="background:' + pr[1] + '2e">' + t[pr[0]] + '</span></div>';
  });
  h += '<div style="height:14px"></div>';
  h += '<div class="sec"><h2>' + t.myfields + '</h2><a class="all" onclick="toggleAll()">' + (showAll ? '↑' : T(t.all, { n: ps.length })) + '</a></div>';
  (showAll ? ps : ps.slice(0, 3)).forEach(function (p) {
    h += '<div class="row" onclick="openField(\'' + p.id + '\')"><div class="sw" style="background:' + COLORS[p.status] + '33">🌾</div>';
    h += '<div class="n"><b>' + fname(p) + '</b><small>' + cropName(p.crop) + ' · ' + p.area_ha + ' ' + t.ha + '</small></div>';
    h += '<span class="sp" style="background:' + COLORS[p.status] + '2e">' + t[p.status] + '</span></div>';
  });
  h += '<p class="demo">' + t.demo + '</p>';
  $('tab-home').innerHTML = h;
}

/* ================== ЗАДАЧИ И ЕЩЁ ================== */
function renderTasks() {
  var t = tr(), h = '<h2 style="margin-top:8px">' + t.journal + '</h2><div style="height:10px"></div>';
  if (!journal.length) h += '<p class="empty">' + t.empty + '</p>';
  journal.forEach(function (j) {
    var p = fields ? findField(j.id) : null;
    h += '<div class="jr"><b>' + (p ? fname(p) : j.id) + '</b><br>' + t.recDone + '<br><small>' + j.ts + '</small></div>';
  });
  $('tab-tasks').innerHTML = h;
}
function renderMore() {
  var t = tr();
  $('tab-more').innerHTML = '<h2 style="margin-top:8px">AgroLand</h2><p class="about">' + t.about + '</p><p class="note">⚠ ' + t.prelimNote + '</p>';
}

/* ================== КАРТА ================== */
function renderLegend() {
  var t = tr(), h = '';
  ['ok', 'dry', 'saline', 'pests'].forEach(function (s) { h += '<li><i style="background:' + COLORS[s] + '"></i>' + t[s] + '</li>'; });
  $('legend').innerHTML = h;
}
function drawFields() {
  if (layer) map.removeLayer(layer);
  var t = tr();
  layer = L.geoJSON(fields, {
    style: function (f) {
      var sel = f.properties.id === selectedId;return { color: sel ? '#ffffff' : COLORS[f.properties.status], weight: sel ? 4 : 2, fillColor: COLORS[f.properties.status], fillOpacity: 0.45 };
    },
    onEachFeature: function (f, l) {
      l.bindTooltip(t[f.properties.status], { permanent: true, direction: 'center', className: 'field-label' });
      l.on('click', function () { selectField(f.properties.id); });
    }
  }).addTo(map);
}
function fit() {
  var feats = selectedId ? fields.features.filter(function (f) { return f.properties.id === selectedId; }) : fields.features;
  var b = L.geoJSON({ type: 'FeatureCollection', features: feats }).getBounds();
  if (b.isValid()) map.fitBounds(b, { padding: [60, 60], maxZoom: 16 });
}
function chartSvg(data) {
  if (!data.length) return '';
  var W = 320, H = 140, pl = 30, pr = 12, pt = 10, pb = 24;
  function x(i) { return data.length === 1 ? W / 2 : pl + i * (W - pl - pr) / (data.length - 1); }
  function y(v) { return pt + (1 - v) * (H - pt - pb); }
  var pts = data.map(function (d, i) { return x(i) + ',' + y(d.ndvi); }).join(' ');
  var g = '';
  [0, 0.5, 1].forEach(function (v) {
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#d9d5c7" stroke-dasharray="3 3"/>';
    g += '<text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="#6b6f60">' + v + '</text>';
  });
  var dots = data.map(function (d, i) {
    return '<circle cx="' + x(i) + '" cy="' + y(d.ndvi) + '" r="4" fill="#1e5b4a"/>' +
      '<text x="' + x(i) + '" y="' + (y(d.ndvi) - 8) + '" font-size="11" text-anchor="middle" fill="#1f2a24">' + d.ndvi + '</text>' +
      '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="11" text-anchor="middle" fill="#6b6f60">' + d.date.slice(5) + '</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + g + '<polyline points="' + pts + '" fill="none" stroke="#1e5b4a" stroke-width="2.5"/>' + dots + '</svg>';
}
async function renderCard() {
  var card = $('card'), f = selectedId && fields ? findField(selectedId) : null;
  if (!f) { card.classList.remove('open'); return; }
  var t = tr(), hist = await getHistory(f.id), h = '';
  h += '<div class="ch"><div><h2>' + f.name + '</h2><span class="pill" style="background:' + COLORS[f.status] + '">' + t[f.status] + '</span>';
  if (f.preliminary) h += '<span class="pill prelim">' + t.prelim + '</span>';
  h += '</div><button class="close" aria-label="' + t.close + '" onclick="selectField(null)">×</button></div>';
  h += '<div class="dl">';
  h += '<div><small>' + t.crop + '</small><b>' + cropName(f.crop) + '</b></div>';
  h += '<div><small>NDVI</small><b>' + f.ndvi + '</b></div>';
  h += '<div><small>SI 1</small><b>' + f.si1 + '</b></div>';
  h += '<div><small>SWIR SI</small><b>' + f.swir_si + '</b></div>';
  h += '<div><small>' + t.irr + '</small><b>' + f.irrigation_mm + ' ' + t.mm + '</b></div>';
  h += '<div><small>' + t.date + '</small><b>' + f.updated_at + '</b></div></div>';
  h += '<p class="advice"><b>' + t.advice + ':</b> ' + t.adviceBy[f.status] + '</p>';
  h += '<h3>' + t.history + '</h3>' + chartSvg(hist);
  if (f.preliminary) h += '<p class="note">⚠ ' + t.prelimNote + '</p>';
  h += '<button class="done" onclick="markDone(\'' + f.id + '\', this)">' + t.done + '</button>';
  card.innerHTML = h;
  card.classList.add('open');
}
function markDone(id, btn) {
  journal.unshift({ id: id, ts: new Date().toISOString().slice(0, 16).replace('T', ' ') });
  store('journal', JSON.stringify(journal));
  btn.disabled = true;
  btn.textContent = '✓ ' + tr().saved;
  renderTasks();
}
function selectField(id) {
  selectedId = id;
  drawFields();
  fit();
  renderCard();
}
function openField(id) {
  setTab('map');
  selectField(id);
}

/* ================== НАВИГАЦИЯ И ЯЗЫК ================== */function renderNav() {
  var t = tr(), h = '';
  TABS.forEach(function (n) {
    h += '<button data-tab="' + n + '" class="' + (n === tab ? 'on' : '') + '" onclick="setTab(\'' + n + '\')"><span>' + ICONS[n] + '</span>' + t[n] + '</button>';
  });
  $('nav').innerHTML = h;
  $('sub').textContent = t.sub;
  $('lang').value = lang;
  document.documentElement.lang = lang;
}
function setTab(name) {
  tab = name;
  TABS.forEach(function (n) { $('tab-' + n).classList.toggle('on', n === name); });
  renderNav();
  if (name === 'map') setTimeout(function () { map.invalidateSize(); fit(); }, 50);
  if (tg) { if (name === 'home') tg.BackButton.hide(); else tg.BackButton.show(); }
}
function renderAll() {
  renderNav();
  if (!fields) return;
  renderHome(); renderTasks(); renderMore(); renderLegend();
  drawFields(); renderCard();
}
$('lang').onchange = function () {
  lang = this.value;
  store('lang', lang);
  renderAll();
};

/* ================== СТАРТ ================== */
renderNav();
$('tab-home').innerHTML = '<p class="empty">' + tr().loading + '</p>';
setTab('home');
getFields().then(function (data) {
  fields = data;
  renderAll();
  var f = params.get('field');
  if (f && findField(f)) openField(f);
}).catch(function () {
  $('tab-home').innerHTML = '<p class="empty">' + tr().error + '</p>';
});

</script>
</body>
